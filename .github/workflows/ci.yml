name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libgbm-dev libegl-dev libwayland-dev pkg-config rpm file

      - run: npm ci
      - run: npm run check
        if: runner.os == 'Windows'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        if: runner.os == 'Windows'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  version:
    name: Detect new version
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: a release will be published"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Prepare release v${{ needs.version.outputs.version }}
    needs: [checks, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      # The tag only exists once the draft is published, so the version job keeps detecting
      # this version as new until the release goes out. A draft left by a failed run is reused.
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          notes=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "See the commit history for changes in this release." > "$notes"
          fi
          # The releases/tags/{tag} endpoint does not return drafts, so search the list instead.
          find_draft() {
            gh api --paginate "repos/${REPOSITORY}/releases" \
              --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id" | head -n 1
          }
          release_id=$(find_draft)
          if [ -n "$release_id" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/releases/${release_id}" \
              -f target_commitish="${TARGET_SHA}" -F body=@"$notes" > /dev/null
          else
            gh release create "v${VERSION}" --draft --target "${TARGET_SHA}" \
              --title "KeepShot v${VERSION}" --notes-file "$notes"
            release_id=$(find_draft)
          fi
          if [ -z "$release_id" ]; then
            echo "Could not find the draft release for v${VERSION}" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: [version, create-release]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: appimage,deb,rpm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libgbm-dev libegl-dev libwayland-dev pkg-config rpm file

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish-release:
    name: Publish release v${{ needs.version.outputs.version }}
    needs: [create-release, build, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true > /dev/null
