[package]
name = "keepshot"
version = "0.1.3"
description = "Lightweight screenshot tool with local history and re-editable annotations"
authors = ["SaGgaSsa"]
edition = "2021"
license = "MIT"
repository = "https://github.com/SaGgaSsa/keepshot"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keepshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
tauri-plugin-global-shortcut = "2.4.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
tauri-plugin-clipboard-manager = { version = "2.4.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Capture and image encoding are CPU-bound; keep them fast in `tauri dev`.
[profile.dev.package."*"]
opt-level = 3
